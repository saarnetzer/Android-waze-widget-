name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk waze-vehicle-toggle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waze-vehicle-toggle
          path: waze-vehicle-toggle.apk
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: גרסה אחרונה
          prerelease: false
          make_latest: true
          files: waze-vehicle-toggle.apk
